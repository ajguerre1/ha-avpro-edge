name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catches breakage from new Home Assistant releases rather than finding out when an
    # upgrade leaves four displays unroutable.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # CI always installs the latest ruff. A stale local copy passes on rules that did not
      # exist yet, so upgrade before trusting a local run.
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  strings:
    name: strings/translations parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # strings.json and translations/en.json must stay byte-identical. `diff` also fails
      # when exactly one of them exists, which is the other way this drifts.
      - name: strings.json and translations/en.json must be identical
        run: |
          base=custom_components/ha_avpro_edge
          if [ ! -e "$base/strings.json" ] && [ ! -e "$base/translations/en.json" ]; then
            echo "Neither file exists yet - nothing to compare."
            exit 0
          fi
          diff "$base/strings.json" "$base/translations/en.json"

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Home Assistant cannot be imported on Windows, so the HA-dependent tests under
      # tests/ha/ only run here. The vendored avpro client has no HA imports and runs
      # everywhere.
      - run: pip install -r requirements-test.txt
      # Enforced at the Silver bar, not reported.
      #
      # This previously said a threshold "would turn every unrelated change into a coverage
      # argument", and reported the number instead so the quality-scale claim could be checked
      # against something. Nobody checked it. The claim in quality_scale.yaml drifted to a stale
      # percentage, a stale statement count, and arithmetic that was wrong when it was written --
      # three errors in one comment that a build failure would have made impossible.
      #
      # 95 is not a local target. It is the number the Home Assistant quality scale requires for
      # Silver, so this does not say "add tests to unrelated work"; it says the integration may
      # not quietly drop below the level it claims. Raising it after a good week would be the
      # version of this that earns the original objection.
      - run: >-
          pytest tests/ -v --cov=custom_components/ha_avpro_edge
          --cov-report=term-missing --cov-fail-under=95
